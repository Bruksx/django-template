{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Share Job</title>
  </head>

  <body
    style="
      font-family: Arial, Helvetica, sans-serif;
      background-color: #e7effa;
      padding: 20px;
      margin: 0;
    "
  >
    <!-- Hidden preview text (for email clients) -->
    <div
      style="
        display: none;
        font-size: 0;
        color: transparent;
        line-height: 0;
        max-height: 0;
        mso-hide: all;
        opacity: 0;
        overflow: hidden;
      "
    >
      Check out this amazing job opportunity recommended for you!
    </div>

    <!-- Main Container -->
    <table
      align="center"
      border="0"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="max-width: 660px; margin: 0 auto; background-color: #ffffff; box-shadow: 0 0 15px rgba(0, 0, 3, 0.1);"
    >
      <tr>
        <td style="padding: 20px">
          <!-- Header Image -->
          <img
            src="{% static 'img/share_job/header-image.png' %}"
            alt="Job Recommendation Header"
            width="100%"
            style="display: block; border: 0; outline: none; text-decoration: none;"
          />
        </td>
      </tr>

      <!-- Email Body -->
      <tr>
        <td style="padding: 0 20px 80px 20px">
          <h1
            style="
              font-size: 24px;
              font-weight: bold;
              margin-bottom: 20px;
              color: #333333;
            "
          >
            A job has been recommended to you
          </h1>

          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              border: 1px solid #eaeaea;
              border-radius: 10px;
              background-color: #fbfbfb;
              padding: 10px;
            "
          >
            <tr>
              <!-- Job Image -->
              <td width="100" valign="top" style="padding-right: 10px">
                <img
                  src="{{ company_logo }}"
                  alt="Job Image"
                  width="100"
                  height="100"
                  style="
                    display: block;
                    object-fit: cover;
                    border-radius: 4px;
                  "
                />
              </td>

              <!-- Job Details -->
              <td valign="top" style="font-size: 13px; color: #013832;">
                <h2
                  style="
                    font-size: 18px;
                    font-weight: bold;
                    line-height: 20px;
                    margin: 0 0 5px 0;
                    color: #323232;
                  "
                >
                  {{ job_title }}
                </h2>

                <p style="margin: 0 0 5px 0;">
                  <img
                    src="{% static 'img/share_job/company.png' %}"
                    alt="Company"
                    width="11"
                    height="12"
                    style="vertical-align: middle; margin-right: 5px;"
                  />
                  {{ company }}
                </p>

                <p style="margin: 0 0 5px 0;">
                  <img
                    src="{% static 'img/share_job/location.png' %}"
                    alt="Location"
                    width="11"
                    height="13"
                    style="vertical-align: middle; margin-right: 5px;"
                  />
                  {{ location }}
                </p>

                <p style="margin: 0;">
                  <img
                    src="{% static 'img/share_job/structure.png' %}"
                    alt="Structure"
                    width="11"
                    height="13"
                    style="vertical-align: middle; margin-right: 5px;"
                  />
                  {{ structure }}
                </p>
              </td>
            </tr>
          </table>

          <!-- CTA Button -->
          <div style="text-align: center; margin-top: 60px;">
            <a
              href="{{ job_link }}"
              style="
                background-color: #266b5b;
                color: #ffffff;
                padding: 15px 40px;
                border-radius: 5px;
                text-decoration: none;
                font-size: 16px;
                font-weight: 500;
                display: inline-block;
              "
            >
              View Job Details
            </a>
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
