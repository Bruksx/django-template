{% extends "base.html" %}
{% load static %}
{% block base_content %}
  <div style="width: 100%; max-width: 600px; margin: 0 auto; padding: 20px; box-sizing: border-box; background-color: #ffffff; border: 1px solid #dddddd; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);">
    <div style="text-align: center; padding: 20px;">
      <h3 style="font-size: 18px; color: #333333; margin-bottom: 20px; font-family: Arial, Helvetica, sans-serif;">
        This is your One Time Password (OTP)
      </h3>
      <div style="width: 100%; max-width: 450px; height: 120px; margin: 0 auto; background: url('{{image_url}}/base/dashed.png') no-repeat center center; background-size: contain; position: relative;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #ffffff; border-radius: 50px; padding: 20px 60px; font-size: 24px; font-weight: bold; color: #3490ec; letter-spacing: 10px; font-family: Arial, Helvetica, sans-serif;">
          {{ code }}
        </div>
      </div>
    </div>
  </div>
{% endblock %}
