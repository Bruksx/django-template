{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Complete Your Profile</title>
    <style>
      @media only screen and (max-width: 600px) {
        .cta-button {
          font-size: 14px !important;
          padding: 12px 20px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      font-family: Arial, Helvetica, sans-serif;
      background-color: #e7effa;
      padding: 20px;
      margin: 0;
    "
  >
    <div
      style="
        max-width: 660px;
        margin: 0 auto;
        padding: 20px 20px 80px;
        background-color: white;
        box-shadow: 0px 0px 15px rgba(0, 0, 3, 0.1);
      "
    >

      <!-- Email Body -->
      <div style="margin-top: 40px">
        <p
          style="
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #323232;
          "
        >
          Hi {{ user }},
        </p>

        <p
          style="
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #323232;
          "
        >
          This is an email from {{ company }} to verify that your email address is valid.
            Please click on the link below to verify your email address. This link will expire in 24 hours.
        </p>
        <div style="margin-top: 100px; text-align: center">
          <a
            href="{{ link }}"
            class="cta-button"
            style="
              background-color: #266b5b;
              color: white;
              padding: 15px 40px;
              border-radius: 5px;
              text-decoration: none;
              font-size: 16px;
              font-weight: 500;
              display: inline-block;
            "
          >
            Verify Your Email Address
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
