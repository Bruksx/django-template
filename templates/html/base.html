<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Template</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        footer {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }

        .content {
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">

        <header>
            <h1>1840</h1>
            <p>1840 and company</p>
        </header>

        <div class="content">
            {% block content %}
            {% endblock %}
        </div>

        <footer>
        <p>Copyright &copy; {{ now.year }} Your Company Name. All rights reserved.</p>
        <p>Contact: <a href="mailto:contact@yourcompany.com">contact@yourcompany.com</a></p>
</footer>

    </div>

</body>
</html>
